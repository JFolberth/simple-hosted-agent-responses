name: Push Image to ACR
description: Pushes a pre-built image archive to ACR with skopeo. Assumes Azure CLI is already authenticated in the calling job.

inputs:
  acr_endpoint:
    description: Full ACR login server (e.g. myregistry.azurecr.io)
    required: true
  image_name:
    description: Image name (without registry prefix or tag)
    required: true
  image_tag:
    description: Image tag
    required: true
  artifact_name:
    description: Name of the uploaded image artifact
    required: false
    default: agent-image
  archive_file:
    description: Gzipped docker-archive file contained in the artifact
    required: false
    default: agent-image.tar.gz

runs:
  using: composite
  steps:
    - name: Download image artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}

    # skopeo copies the archive straight to the registry, so no Docker daemon
    # is required and the image digest is preserved.
    - name: Push image to ACR
      shell: bash
      env:
        ACR_ENDPOINT: ${{ inputs.acr_endpoint }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        ARCHIVE_FILE: ${{ inputs.archive_file }}
      run: |
        set -euo pipefail

        gunzip --force "${ARCHIVE_FILE}"
        ARCHIVE="${ARCHIVE_FILE%.gz}"

        # Minted at runtime, so Actions cannot mask it automatically.
        TOKEN=$(az acr login --name "${ACR_ENDPOINT%.azurecr.io}" --expose-token --query accessToken -o tsv)
        echo "::add-mask::${TOKEN}"

        AUTHFILE="${RUNNER_TEMP}/acr-auth.json"
        trap 'skopeo logout --authfile "${AUTHFILE}" "${ACR_ENDPOINT}" >/dev/null 2>&1 || true; rm -f "${AUTHFILE}"' EXIT

        skopeo login "${ACR_ENDPOINT}" \
          --username 00000000-0000-0000-0000-000000000000 \
          --password-stdin \
          --authfile "${AUTHFILE}" <<< "${TOKEN}"

        skopeo copy \
          --authfile "${AUTHFILE}" \
          "docker-archive:${ARCHIVE}" \
          "docker://${ACR_ENDPOINT}/${IMAGE_NAME}:${IMAGE_TAG}"
